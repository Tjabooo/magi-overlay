[package]
name = "magi-overlay"
version = "0.1.0"
edition = "2021"
description = "Self-hosted, MAGI-themed stream overlay for OBS: Twitch chat, alerts, live system stats, now playing, scene pages"
license = "MIT"
repository = "https://github.com/Tjabooo/magi-overlay"
readme = "README.md"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
toml = "0.9"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
